<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Chaaya 0.4.1 themeScript, before first paint. Kept in sync by the theme test. -->
<script>(function(){var m=null;try{m=localStorage.getItem("chaaya-theme")}catch(e){}if(m==="light"||m==="dark"){document.documentElement.dataset.theme=m}})()</script>
%sveltekit.head%
</head>
<body><div style="display: contents">%sveltekit.body%</div></body>
</html>
